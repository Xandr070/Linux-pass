<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head}">
    <title id="pageTitle">Список авторов</title>
</head>
<body>
    <div id="content">
        <div class="d-flex justify-content-between align-items-center">
            <h1>Список авторов</h1>
            <a href="/web/authors/add" class="btn btn-primary">Добавить автора</a>
        </div>
        
        <table class="table mt-4">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Имя</th>
                    <th>Год рождения</th>
                    <th>Страна</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="author : ${authors}">
                    <td th:text="${author.id}">1</td>
                    <td th:text="${author.name}">Имя автора</td>
                    <td th:text="${author.birthYear}">1828</td>
                    <td th:text="${author.country}">Россия</td>
                    <td>
                        <a th:href="@{/web/authors/edit/{id}(id=${author.id})}" class="btn btn-sm btn-warning">Редактировать</a>
                        <a th:href="@{/web/authors/delete/{id}(id=${author.id})}" class="btn btn-sm btn-danger" 
                           onclick="return confirm('Вы уверены? Это также удалит все книги автора!')">Удалить</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
