<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head}">
    <title id="pageTitle">Добавить книгу</title>
</head>
<body>
    <div id="content">
        <h1>Добавить книгу</h1>
        
        <form th:action="@{/web/books/add}" th:object="${book}" method="post" class="mt-4">
            <div class="mb-3">
                <label for="title" class="form-label">Название</label>
                <input type="text" class="form-control" id="title" th:field="*{title}" required>
            </div>
            
            <div class="mb-3">
                <label for="authorId" class="form-label">Автор</label>
                <select class="form-control" id="authorId" th:field="*{authorId}" required>
                    <option value="">Выберите автора</option>
                    <option th:each="author : ${authors}"
                            th:value="${author.id}"
                            th:text="${author.name}">Имя автора</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label for="genre" class="form-label">Жанр</label>
                <input type="text" class="form-control" id="genre" th:field="*{genre}" required>
            </div>
            
            <div class="mb-3">
                <label for="publishYear" class="form-label">Год издания</label>
                <input type="number" class="form-control" id="publishYear" th:field="*{publishYear}" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="/web/books" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</body>
</html>
