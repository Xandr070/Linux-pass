<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head}">
    <title id="pageTitle">Список книг</title>
</head>
<body>
    <div id="content">
        <div class="d-flex justify-content-between align-items-center">
            <h1>Список книг</h1>
            <a href="/web/books/add" class="btn btn-primary">Добавить книгу</a>
        </div>
        
        <table class="table mt-4">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Жанр</th>
                    <th>Год издания</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.id}">1</td>
                    <td th:text="${book.title}">Название книги</td>
                    <td th:text="${book.genre}">Жанр</td>
                    <td th:text="${book.publishYear}">2024</td>
                    <td>
                        <a th:href="@{/web/books/edit/{id}(id=${book.id})}" class="btn btn-sm btn-warning">Редактировать</a>
                        <a th:href="@{/web/books/delete/{id}(id=${book.id})}" class="btn btn-sm btn-danger" 
                           onclick="return confirm('Вы уверены?')">Удалить</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
